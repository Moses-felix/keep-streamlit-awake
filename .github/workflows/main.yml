name: Keep Streamlit apps awake
on:
  schedule:
    - cron: "0 */4 * * *"   # toutes les 4 heures
  workflow_dispatch:         # permet de le lancer à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Réveiller les apps
        run: |
          python - <<'EOF'
          import re
          from playwright.sync_api import sync_playwright

          URLS = [
              "https://postula.streamlit.app/",
              "https://cleaner-dataset.streamlit.app/",
              "https://agent-interpreteur-resultat-fichier.streamlit.app/",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for url in URLS:
                  page = browser.new_page()
                  try:
                      page.goto(url, timeout=120000)
                      page.wait_for_timeout(5000)
                      btn = page.get_by_role("button", name=re.compile("get this app back up", re.I))
                      if btn.count() > 0:
                          btn.first.click()
                          print(f"RÉVEILLÉE : {url}")
                          page.wait_for_timeout(60000)
                      else:
                          print(f"Déjà active : {url}")
                          page.wait_for_timeout(15000)
                  except Exception as e:
                      print(f"ERREUR sur {url} : {e}")
                  finally:
                      page.close()
              browser.close()
          EOF
